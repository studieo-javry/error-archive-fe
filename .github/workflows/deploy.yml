name: Deploy FE

on:
  push:
    branches: [master]    # master push = 즉시 프로덕션 배포
  workflow_dispatch:      # 코드 변경 없이 재배포 (Variables 수정 후 재빌드용)

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # 이미지 태그 갱신 커밋 push
      packages: write     # ghcr 이미지 push
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # `npm run lint` / `npm run test` 는 현재 실행 불가 (eslint.config.js 없음 /
      # 테스트 0개 + jsdom 미설치). 복구되면 이 위치에 추가한다.
      # 지금은 build 의 vue-tsc 가 유일한 게이트다. 상세: docs/fe-deploy-runbook.md 4-4
      - run: npm run build
        env:
          VITE_OFFLINE_MODE: 'false'
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_SSE_BASE_URL: ${{ vars.VITE_SSE_BASE_URL }}
          VITE_GITHUB_CLIENT_ID: ${{ vars.VITE_GITHUB_CLIENT_ID }}
          VITE_GITHUB_REDIRECT_URI: ${{ vars.VITE_GITHUB_REDIRECT_URI }}
          VITE_GITHUB_INTEGRATION_ENABLED: ${{ vars.VITE_GITHUB_INTEGRATION_ENABLED }}

      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # ── OCI(k3s) 배포 경로 ──────────────────────────────────────────────
      # 위에서 만든 dist/ 를 nginx 이미지로 묶어 ghcr 에 올리고, 매니페스트의 이미지 태그를 갱신한다.
      # ArgoCD(error-archive-fe)가 그 커밋을 감지해 배포한다. 전환이 끝날 때까지 Worker 배포와 병행.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 노드가 arm64. Dockerfile 에 RUN 이 없어 amd64 러너에서 QEMU 없이 빌드된다.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/studieo-javry/error-archive-fe:${{ github.sha }}
            ghcr.io/studieo-javry/error-archive-fe:latest

      # GITHUB_TOKEN 으로 push 한 커밋은 워크플로를 다시 트리거하지 않는다([skip ci] 는 이중 안전장치).
      - name: bump image tag
        run: |
          sed -i -E "s|^([[:space:]]*newTag:).*|\1 ${GITHUB_SHA}|" deploy/k8s/kustomization.yaml
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy/k8s/kustomization.yaml
          git commit -m "ci: bump error-archive-fe to ${GITHUB_SHA} [skip ci]" || { echo "no change"; exit 0; }
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
