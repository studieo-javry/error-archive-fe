apiVersion: apps/v1
kind: Deployment
metadata:
  name: error-archive-fe
  labels: { app: error-archive-fe }
spec:
  replicas: 1
  selector:
    matchLabels: { app: error-archive-fe }
  # 단일 replica 무중단 롤링: 새 파드가 Ready 된 뒤 기존 파드를 내린다.
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app: error-archive-fe }
    spec:
      # OCI LB 백엔드가 platform 노드(node1)의 NodePort 를 본다.
      nodeSelector: { role: platform }
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: nginx
          image: error-archive-fe
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            # nginx-unprivileged 는 pid·임시 파일을 /tmp 에 쓴다.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
