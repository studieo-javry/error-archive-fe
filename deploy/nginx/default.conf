# error-archive-fe 정적 서빙. OCI LB(HTTPS 종료) → NodePort → 여기(HTTP 8080).
# `/p/*`(발행 공개 페이지)는 LB 라우팅 정책이 gateway 로 직접 보내므로 여기로 오지 않는다.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # try_files/디렉터리 리다이렉트가 내부 포트(8080)를 Location 에 싣지 않게 한다.
    absolute_redirect off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    # text/html 은 기본 포함.
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # LB 헬스 체크 · kubelet 프로브.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite 산출물은 파일명에 콘텐츠 해시가 들어가 내용이 바뀌면 이름도 바뀐다 → 영구 캐시.
    # 없는 파일은 SPA 폴백(index.html) 대신 404. `always` 를 붙이지 않아 404 는 캐시되지 않는다.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # 그 외 경로는 SPA 폴백. index.html 은 매번 재검증해 새 배포를 바로 반영한다.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
